# Copies this README to hey24sheep/hey24sheep.github.io (site/profile/README.md),
# where it is the content of hey24sheep.com; that push triggers the site's deploy.
name: Sync README to hey24sheep.com

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: profile
      - uses: actions/checkout@v4
        with:
          repository: hey24sheep/hey24sheep.github.io
          token: ${{ secrets.ACTION_ADMIN }}
          path: web
      - name: Copy README and push
        run: |
          mkdir -p web/site/profile
          cp profile/README.md web/site/profile/README.md
          cd web
          git add site/profile/README.md
          if git diff --cached --quiet; then
            echo "README unchanged; nothing to sync."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync profile README from hey24sheep/hey24sheep@${GITHUB_SHA::7}"
          git push
